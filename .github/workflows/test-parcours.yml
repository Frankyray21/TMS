name: Tests des parcours et des calculs

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tester sans réseau ni données réelles
        run: node --test tests/*.test.cjs tests/*.test.mjs cotation-video/tests/*.test.mjs
